<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#315efb" />
  <title>SkillSync | Campus Team Dashboard</title>
  <style>
    :root{--blue:#315efb;--blue-dark:#2449ce;--ink:#14213d;--muted:#5d6c86;--bg:#f7f9fc;--line:#e3e8f2;--soft:#eaf0ff;--green:#148a59;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.scene{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 17% 8%,#e6edffb8,transparent 32%),radial-gradient(circle at 84% 15%,#e7f8ff9c,transparent 28%),linear-gradient(#f9fbffcc,#f7f9fcf0)}.container{width:min(1120px,calc(100% - 32px));margin:auto}header{position:sticky;top:0;z-index:10;background:#ffffffdd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.5px}.brand-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(135deg,#315efb,#7858e7);box-shadow:0 7px 15px #315efb4d}.nav-links{display:flex;gap:22px;color:var(--muted);font-size:14px}.nav-links a.active,.nav-links a:hover{color:var(--blue);font-weight:800}.btn{min-height:43px;padding:10px 17px;border:0;border-radius:9px;font-weight:750;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;transition:.2s}.btn-primary{color:#fff;background:var(--blue);box-shadow:0 6px 16px #315efb38}.btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px)}.btn-outline{color:var(--ink);border:1px solid var(--line);background:#fff}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}main{min-height:calc(100vh - 140px);padding:48px 0 64px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:38px;align-items:center;padding:23px 0 54px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}h1{max-width:760px;margin:12px 0 18px;font-size:clamp(39px,6vw,65px);letter-spacing:-2.7px;line-height:1.04}h2{margin:0;font-size:25px;letter-spacing:-.7px}h3{margin:0;font-size:17px}.lead,.muted{color:var(--muted);line-height:1.65}.lead{max-width:630px;font-size:17px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:#fffffff2;box-shadow:0 8px 22px #14213d06}.hero-card{box-shadow:0 16px 38px #14213d12}.feature{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.feature:last-child{border:0}.feature-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;color:var(--blue);background:var(--soft);font-size:20px;font-weight:800}.small-text{margin:4px 0 0;color:var(--muted);font-size:13px}.section{margin-top:45px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.student-card{display:flex;flex-direction:column;gap:12px;transition:.2s}.student-card:hover,.hackathon-card:hover{border-color:#b8c7ff;box-shadow:0 12px 28px #14213d14;transform:translateY(-2px)}.student-header{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;display:grid;flex-shrink:0;place-items:center;border-radius:50%;color:#fff;font-weight:800;background:linear-gradient(135deg,#315efb,#7a59ea)}.role{margin:0;color:var(--muted);font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:5px 9px;border-radius:20px;color:#2948ad;background:var(--soft);font-size:12px;font-weight:750}.team-note{margin:auto 0 0;color:var(--green);font-size:13px}.hackathon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.hackathon-card{display:flex;gap:16px;transition:.2s}.date-box{width:65px;min-width:65px;height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;color:var(--blue);background:var(--soft);font-weight:800}.date-box span{text-transform:uppercase;font-size:11px}.date-box strong{font-size:21px}.hackathon-card p{margin:8px 0;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px}.filters{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;align-items:end;margin:25px 0 22px}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:750}input,select,textarea{width:100%;min-height:43px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;outline:0;color:var(--ink);background:#fff}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315efb17}.profile-layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.profile-summary{height:fit-content;text-align:center}.profile-summary .avatar{width:80px;height:80px;margin:0 auto 14px;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.notice{display:none;margin-top:15px;padding:12px;border-radius:8px;color:#12613f;background:#e4f7ee;font-size:14px}.empty{grid-column:1/-1;padding:44px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--ink);font-size:18px}footer{padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px}@media(max-width:800px){.hero,.profile-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav-links{display:none}.grid,.hackathon-grid,.filters,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.section-heading{align-items:start;flex-direction:column}main{padding-top:30px}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-hidden="true"></div>
  <header><nav class="container"><a class="brand" href="#home"><span class="brand-icon">S</span>SkillSync</a><div class="nav-links"><a href="#home">Home</a><a href="#students">Find Students</a><a href="#hackathons">Hackathons</a><a href="#add-hackathon">Add Hackathon</a><a href="#profile">My Profile</a></div><a class="btn btn-primary" href="#profile">Create Profile</a></nav></header>
  <main class="container" id="app"></main><footer><div class="container">SkillSync — Your campus space to find people and build better teams.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script>
    // Stored locally for now; replace this with a database request when you add your backend.
    const events=JSON.parse(localStorage.getItem('skillsyncEvents')||'[]');
    const app=document.querySelector('#app'); const savedProfile=()=>JSON.parse(localStorage.getItem('skillsyncProfile')||'null'); const esc=value=>String(value||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const tags=items=>items.map(item=>`<span class="tag">${esc(item)}</span>`).join('');
    function profileCard(p){const initials=p.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase()||'S';const skills=p.skills.split(',').map(x=>x.trim()).filter(Boolean);return `<article class="card student-card"><div class="student-header"><div class="avatar">${esc(initials)}</div><div><h3>${esc(p.name)}</h3><p class="small-text">${esc(p.year||'Student')} · ${esc(p.role)}</p></div></div><p class="role">${esc(p.bio||'Ready to collaborate on a campus project.')}</p><div class="tags">${tags(skills)}</div><p class="team-note">● Looking for a team of ${esc(p.teamSize)}</p><button class="btn btn-outline connect-btn">Connect</button></article>`}
    const eventCard=e=>`<article class="card hackathon-card"><div class="date-box"><span>${e.month}</span><strong>${e.date}</strong></div><div><h3>${esc(e.title)}</h3><p class="muted">${esc(e.organizer)} · ${esc(e.venue)}</p><div class="meta"><span>Team size: ${esc(e.teams)}</span><span>Prize pool: ${esc(e.prizePool)}</span></div><p class="small-text">Registration deadline: ${esc(e.deadline)}</p><div class="tags" style="margin-top:12px">${tags([e.domain])}</div><p class="small-text">Eligible branches: ${esc(e.branches)}</p><a class="btn btn-outline" style="margin-top:12px" href="${esc(e.link)}" target="_blank" rel="noopener">Register</a></div></article>`;
    const empty=message=>`<div class="card empty"><strong>No student profiles yet</strong><span>${message}</span></div>`;
    const emptyEvents=()=>`<div class="card empty"><strong>No hackathons added yet</strong><span>Campus events will appear here when they are added.</span></div>`;
    const home=()=>{const p=savedProfile();return `<section class="hero"><div><div class="eyebrow">Campus teams, made simpler</div><h1>Find the people who complete your next project team.</h1><p class="lead">SkillSync is your college's space to discover teammates by skill, form balanced teams, and keep up with campus hackathons.</p><div class="actions"><a class="btn btn-primary" href="#students">Find Teammates</a><a class="btn btn-outline" href="#hackathons">Explore Hackathons</a></div></div><aside class="card hero-card"><div class="feature"><div class="feature-icon">⌕</div><div><strong>Search by real skills</strong><p class="small-text">Find developers, designers, and AI enthusiasts.</p></div></div><div class="feature"><div class="feature-icon">✓</div><div><strong>Build balanced teams</strong><p class="small-text">See each member's skills and preferred team size.</p></div></div><div class="feature"><div class="feature-icon">◷</div><div><strong>Never miss an event</strong><p class="small-text">Keep campus hackathons in one convenient place.</p></div></div></aside></section><section class="section"><div class="section-heading"><div><h2>Students ready to build</h2><p class="muted">Create your profile to become the first person listed here.</p></div><a class="btn btn-outline" href="#students">View students</a></div><div class="grid">${p?profileCard(p):empty('Be the first to create a profile and start your team.')}</div></section><section class="section"><div class="section-heading"><div><h2>Upcoming hackathons</h2><p class="muted">Events added by your college will appear here.</p></div><a class="btn btn-outline" href="#hackathons">View events</a></div><div class="hackathon-grid">${events.length?events.slice(0,2).map(eventCard).join(''):emptyEvents()}</div></section>`};
    const studentsPage=()=>`<section><div class="eyebrow">Student Directory</div><h1 style="font-size:clamp(35px,5vw,54px)">Find your next teammate.</h1><p class="lead">Search by the skills you need and preferred team size.</p><div class="card filters"><label>Skill<input id="skillFilter" placeholder="React, Python, Figma..." /></label><label>Team size<select id="teamSizeFilter"><option value="">Any team size</option><option value="2">2 members</option><option value="4">4 members</option><option value="6">6 members</option></select></label><button class="btn btn-primary" id="clearFilters">Clear</button></div><p class="muted" id="studentCount"></p><div class="grid" id="studentResults"></div></section>`;
    const eventsPage=()=>`<section><div class="section-heading"><div><div class="eyebrow">Campus Events</div><h1 style="font-size:clamp(35px,5vw,54px)">Plan your next build.</h1><p class="lead">Your campus hackathons appear here after they are added.</p></div><a class="btn btn-primary" href="#add-hackathon">Add Hackathon</a></div><div class="hackathon-grid">${events.length?events.map(eventCard).join(''):emptyEvents()}</div></section>`;
    const addHackathonPage=()=>`<section><div class="eyebrow">Event Editor</div><h1 style="font-size:clamp(35px,5vw,54px)">Add a hackathon.</h1><p class="lead">Fill in the official event details. It will immediately appear in the Hackathons section.</p><form class="card" id="hackathonForm"><div class="form-grid"><label class="full">Hackathon name<input name="title" placeholder="Enter hackathon name" required></label><label>Domain<select name="domain" required><option value="">Select a domain</option><option>Hardware</option><option>Software</option><option>AI / ML</option><option>Web Development</option><option>IoT</option></select></label><label>Date<input name="eventDate" type="date" required></label><label>Registration deadline<input name="registrationDeadline" type="date" required></label><label>Eligible branches<input name="branches" placeholder="CSE, ECE, Mechanical..." required></label><label>Team size<select name="teamSize" required><option value="">Select team size</option><option value="1">1 member</option><option value="2">2 members</option><option value="4">4 members</option><option value="6">6 members</option></select></label><label>Prize pool<input name="prizePool" placeholder="e.g. ₹50,000" required></label><label>Venue<input name="venue" placeholder="Auditorium / Online" required></label><label>Organizer<input name="organizer" placeholder="Club or organization name" required></label><label class="full">Eligibility<textarea name="eligibility" placeholder="Who can participate? Add any requirements." required></textarea></label><label class="full">Registration link<input name="link" type="url" placeholder="https://..." required></label></div><div class="actions"><button class="btn btn-primary" type="submit">Publish Hackathon</button><a class="btn btn-outline" href="#hackathons">Cancel</a></div><div class="notice" id="eventMessage"></div></form></section>`;
    const profilePage=()=>{const p=savedProfile()||{};return `<section class="profile-layout"><aside class="card profile-summary"><div class="avatar">${esc((p.name||'Your Name').split(' ').map(n=>n[0]).slice(0,2).join(''))}</div><h2>${p.name?esc(p.name):'Your Profile'}</h2><p class="muted">Add your skills and ideal team size so other students can find you.</p><div class="tags" style="justify-content:center"><span class="tag">Campus profile</span></div></aside><div><div class="eyebrow">Profile Editor</div><h1 style="font-size:clamp(35px,5vw,54px)">Show what you can build.</h1><p class="lead">Your profile stays saved in this browser until you connect it to your backend.</p><form class="card" id="profileForm"><div class="form-grid"><label>Full name<input name="name" value="${esc(p.name)}" placeholder="Enter your name" required></label><label>Year of study<select name="year"><option ${p.year==='1st year'?'selected':''}>1st year</option><option ${p.year==='2nd year'?'selected':''}>2nd year</option><option ${p.year==='3rd year'?'selected':''}>3rd year</option><option ${p.year==='4th year'?'selected':''}>4th year</option></select></label><label>Role<select name="role"><option>Frontend Developer</option><option>Backend Developer</option><option>Product Designer</option><option>AI / ML Developer</option><option>Mobile Developer</option><option>Open to learning</option></select></label><label>Preferred team size<select name="teamSize"><option value="2" ${p.teamSize==='2'?'selected':''}>2 members</option><option value="4" ${p.teamSize==='4'?'selected':''}>4 members</option><option value="6" ${p.teamSize==='6'?'selected':''}>6 members</option></select></label><label class="full">Skills<input name="skills" value="${esc(p.skills)}" placeholder="React, JavaScript, Figma" required></label><label class="full">Short bio<textarea name="bio" placeholder="Tell teammates what you want to build.">${esc(p.bio)}</textarea></label></div><div class="actions"><button class="btn btn-primary" type="submit">Save Profile</button></div><div class="notice" id="saveMessage"></div></form></div></section>`};
    function connect(){document.querySelectorAll('.connect-btn').forEach(b=>b.onclick=()=>{b.textContent='Request Sent';b.className='btn btn-primary';b.disabled=true})} function setupFilters(){const results=document.querySelector('#studentResults'),count=document.querySelector('#studentCount'),skill=document.querySelector('#skillFilter'),size=document.querySelector('#teamSizeFilter');const run=()=>{const p=savedProfile();const found=p&&(!skill.value||`${p.role} ${p.skills}`.toLowerCase().includes(skill.value.toLowerCase().trim()))&&(!size.value||p.teamSize===size.value)?[p]:[];count.textContent=`${found.length} student${found.length!==1?'s':''} found`;results.innerHTML=found.length?found.map(profileCard).join(''):empty('No matching profiles yet. Try another skill or create your profile.');connect()};skill.oninput=run;size.onchange=run;document.querySelector('#clearFilters').onclick=()=>{skill.value=size.value='';run()};run()} function setupProfile(){const form=document.querySelector('#profileForm');form.role.value=savedProfile()?.role||'Frontend Developer';form.onsubmit=e=>{e.preventDefault();localStorage.setItem('skillsyncProfile',JSON.stringify(Object.fromEntries(new FormData(form))));const n=document.querySelector('#saveMessage');n.textContent='Profile saved. It is now visible in the student directory.';n.style.display='block'}} function setupHackathon(){const form=document.querySelector('#hackathonForm');form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const [year,month,day]=data.eventDate.split('-');const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];events.push({title:data.title,domain:data.domain,date:day,month:months[Number(month)-1],deadline:data.registrationDeadline,branches:data.branches,teams:data.teamSize,prizePool:data.prizePool,venue:data.venue,organizer:data.organizer,eligibility:data.eligibility,link:data.link});localStorage.setItem('skillsyncEvents',JSON.stringify(events));const n=document.querySelector('#eventMessage');n.textContent='Hackathon published successfully.';n.style.display='block';form.reset()}} function render(){const route=location.hash||'#home';document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active',a.hash===route));app.innerHTML=route==='#students'?studentsPage():route==='#hackathons'?eventsPage():route==='#add-hackathon'?addHackathonPage():route==='#profile'?profilePage():home();if(route==='#students')setupFilters();if(route==='#profile')setupProfile();if(route==='#add-hackathon')setupHackathon();else connect()}window.addEventListener('hashchange',render);render();
    if(window.THREE){const mount=document.querySelector('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);mount.appendChild(renderer.domElement);camera.position.z=7;const geometry=new THREE.BufferGeometry(),count=90,positions=new Float32Array(count*3);for(let i=0;i<positions.length;i++)positions[i]=(Math.random()-.5)*15;geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const dots=new THREE.Points(geometry,new THREE.PointsMaterial({color:0x315efb,size:.035,transparent:true,opacity:.45}));scene.add(dots);const loop=()=>{dots.rotation.y+=.0007;dots.rotation.x+=.00018;renderer.render(scene,camera);requestAnimationFrame(loop)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}
  </script>
</body>
</html>
